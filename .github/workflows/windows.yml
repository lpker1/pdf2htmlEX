name: Build pdf2htmlEX for Windows x86 and x64

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils patch tar
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-fontforge
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-iconv
            python

      - name: Run x64 Build Script
        run: |
          mkdir -p build_logs
          echo "=== Environment Check ===" > build_logs/01-environment.log
          uname -a >> build_logs/01-environment.log
          
          # 编译主程序与打包逻辑
          mkdir -p build && cd build
          CMAKE_POLICY_VERSION_MINIMUM=3.5 cmake .. -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel $(nproc)
          
          # 创建输出目录并复制必要文件
          mkdir -p ../package/data/poppler
          cp pdf2htmlEX.exe ../package/
          
          # 复制依赖 DLL
          cp /ucrt64/bin/libpoppler*.dll ../package/ || true
          cp /ucrt64/bin/libfontforge*.dll ../package/ || true
          cp /ucrt64/bin/libfreetype*.dll ../package/ || true
          cp /ucrt64/bin/libintl-8.dll ../package/ || true
          cp /ucrt64/bin/libiconv-2.dll ../package/ || true
          cp /ucrt64/bin/libglib-2.0-0.dll ../package/ || true
          cp /ucrt64/bin/libgio-2.0-0.dll ../package/ || true
          cp /ucrt64/bin/libgobject-2.0-0.dll ../package/ || true
          cp /ucrt64/bin/libffi-8.dll ../package/ || true
          cp /ucrt64/bin/libpcre2-8-0.dll ../package/ || true
          cp /ucrt64/bin/libxml2-2.dll ../package/ || true
          cp /ucrt64/bin/zlib1.dll ../package/ || true
          cp /ucrt64/bin/libpng16-16.dll ../package/ || true
          cp /ucrt64/bin/libharfbuzz*.dll ../package/ || true
          cp /ucrt64/bin/libfreetype*.dll ../package/ || true
          
          echo "Build finished successfully" > ../build_logs/status.txt

      - name: Prepare Onefile Output Directory
        run: |
          mkdir -p onefile
          # 确保单文件打包路径正确
          if [ -f "package/pdf2htmlEX.exe" ]; then
            cp package/pdf2htmlEX.exe onefile/pdf2htmlEX-x64-onefile.exe
          fi

      - name: Upload x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf2htmlEX-windows-x64-portable
          path: |
            package/
            onefile/
            build_logs/

  build-windows-x86:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 MINGW32
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git make diffutils patch tar
            mingw-w64-i686-toolchain
            mingw-w64-i686-cmake
            mingw-w64-i686-pkgconf
            mingw-w64-i686-poppler
            mingw-w64-i686-fontforge
            mingw-w64-i686-gettext
            mingw-w64-i686-iconv
            python

      - name: Run x86 Build Script
        run: |
          mkdir -p build_logs_x86
          mkdir -p build_x86 && cd build_x86
          CMAKE_POLICY_VERSION_MINIMUM=3.5 cmake .. -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build . --parallel $(nproc)
          
          mkdir -p ../package_x86/data/poppler
          cp pdf2htmlEX.exe ../package_x86/
          
          cp /mingw32/bin/libpoppler*.dll ../package_x86/ || true
          cp /mingw32/bin/libfontforge*.dll ../package_x86/ || true
          cp /mingw32/bin/libintl-8.dll ../package_x86/ || true
          cp /mingw32/bin/libiconv-2.dll ../package_x86/ || true
          cp /mingw32/bin/libglib-2.0-0.dll ../package_x86/ || true
          cp /mingw32/bin/libgobject-2.0-0.dll ../package_x86/ || true
          cp /mingw32/bin/libffi-8.dll ../package_x86/ || true
          cp /mingw32/bin/libpcre2-8-0.dll ../package_x86/ || true
          cp /mingw32/bin/libxml2-2.dll ../package_x86/ || true
          cp /mingw32/bin/zlib1.dll ../package_x86/ || true
          cp /mingw32/bin/libpng16-16.dll ../package_x86/ || true

      - name: Prepare x86 Onefile Directory
        run: |
          mkdir -p onefile_x86
          if [ -f "package_x86/pdf2htmlEX.exe" ]; then
            cp package_x86/pdf2htmlEX.exe onefile_x86/pdf2htmlEX-x86-onefile.exe
          fi

      - name: Upload x86 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf2htmlEX-windows-x86-portable
          path: |
            package_x86/
            onefile_x86/
            build_logs_x86/
