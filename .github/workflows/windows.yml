name: Build pdf2htmlEX native Windows x86 and x64 with Unicode and one-file wrapper (v8)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows.yml'
      - 'buildScripts/**'
      - 'pdf2htmlEX/**'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build pdf2htmlEX Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: UCRT64
            package_prefix: mingw-w64-ucrt-x86_64
            extra_packages: mingw-w64-ucrt-x86_64-cairo mingw-w64-ucrt-x86_64-fontconfig
            need_cairo_source: false
          - arch: x86
            msystem: MINGW32
            package_prefix: mingw-w64-i686
            extra_packages: mingw-w64-i686-pixman
            need_cairo_source: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install MSYS2 base tools (${{ matrix.arch }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            git
            wget
            tar
            patch
            python
            ruby
            meson
            ninja

      - name: Install architecture compiler and libraries (${{ matrix.arch }})
        shell: msys2 {0}
        env:
          PACKAGE_PREFIX: ${{ matrix.package_prefix }}
          EXTRA_PACKAGES: ${{ matrix.extra_packages }}
        run: |
          set -euo pipefail
          mkdir -p logs
          {
            echo "MSYSTEM=$MSYSTEM"
            echo "PACKAGE_PREFIX=$PACKAGE_PREFIX"
            echo "Installing explicit compiler packages instead of the deprecated MINGW32 toolchain group"
            read -r -a extra <<< "$EXTRA_PACKAGES"
            packages=(
              "$PACKAGE_PREFIX-gcc"
              "$PACKAGE_PREFIX-binutils"
              "$PACKAGE_PREFIX-cmake"
              "$PACKAGE_PREFIX-make"
              "$PACKAGE_PREFIX-pkgconf"
              "$PACKAGE_PREFIX-glib2"
              "$PACKAGE_PREFIX-freetype"
              "$PACKAGE_PREFIX-libpng"
              "$PACKAGE_PREFIX-libjpeg-turbo"
              "$PACKAGE_PREFIX-libxml2"
              "$PACKAGE_PREFIX-openjpeg2"
              "$PACKAGE_PREFIX-zlib"
              "$PACKAGE_PREFIX-gettext"
              "$PACKAGE_PREFIX-libiconv"
              "$PACKAGE_PREFIX-lcms2"
            )
            packages+=("${extra[@]}")
            printf 'Requested package: %s\n' "${packages[@]}"
            pacman -S --needed --noconfirm "${packages[@]}"
          } 2>&1 | tee logs/00-architecture-packages.log

      - name: Prepare make wrapper and build environment
        shell: msys2 {0}
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p .win-tools logs

          cat > .win-tools/make <<'EOF'
          #!/usr/bin/env bash
          exec mingw32-make "$@"
          EOF
          chmod +x .win-tools/make

          cat > .win-tools/env.sh <<'EOF'
          export PATH="$PWD/.win-tools:$PATH"
          export CMAKE_GENERATOR="MinGW Makefiles"
          export PDF2HTMLEX_PREFIX="$(cygpath -m "$PWD/_stage")"
          export MAKE_PARALLEL="-j2"
          export UNATTENDED="1"
          export PDF2HTMLEX_BRANCH="${GITHUB_REF_NAME:-master}"
          export PKG_CONFIG_PATH="$MINGW_PREFIX/lib/pkgconfig:$MINGW_PREFIX/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          # Work around a MinGW gettext header alias that otherwise emits undefined __printf__ references.
          export CFLAGS="${CFLAGS:-} -D__printf__=printf"
          export CXXFLAGS="${CXXFLAGS:-} -D__printf__=printf"
          EOF

          source .win-tools/env.sh
          {
            echo "Build architecture: $BUILD_ARCH"
            echo "MSYSTEM: ${MSYSTEM:-<unset>}"
            echo "MINGW_PREFIX: ${MINGW_PREFIX:-<unset>}"
            echo "Generator: $CMAKE_GENERATOR"
            echo "Install prefix: $PDF2HTMLEX_PREFIX"
            echo "Source ref: $PDF2HTMLEX_BRANCH"
            command -v gcc
            command -v g++
            command -v cmake
            command -v mingw32-make
            command -v make
            command -v pkgconf
            gcc -dumpmachine
          } 2>&1 | tee logs/01-environment.log

      - name: Resolve pinned source versions
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source .win-tools/env.sh
          bash ./buildScripts/versionEnvs 2>&1 | tee logs/02-version-envs.log

      - name: Download Poppler sources
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source .win-tools/env.sh
          bash ./buildScripts/getPoppler 2>&1 | tee logs/03-get-poppler.log

      - name: Patch Poppler GLib code-generator path for MSYS2
        shell: msys2 {0}
        run: |
          set -euo pipefail
          {
            echo "MINGW_PREFIX=${MINGW_PREFIX:-<unset>}"
            echo "Python: $(command -v python)"
            echo "CMake: $(command -v cmake)"
            test -n "${MINGW_PREFIX:-}"
            test -f "$MINGW_PREFIX/bin/glib-mkenums-script.py"

            python - <<'PYCODE'
          from pathlib import Path
          import re

          cmake_file = Path("poppler/glib/CMakeLists.txt")
          if not cmake_file.is_file():
              raise SystemExit(f"Expected Poppler CMake file was not found: {cmake_file}")

          text = cmake_file.read_text(encoding="utf-8")
          pattern = re.compile(r"(?is)(find_program\s*\(\s*GLIB2_MKENUMS\b)(.*?)(\))")
          match = pattern.search(text)
          if not match:
              matching = [line for line in text.splitlines()
                          if "GLIB2_MKENUMS" in line or "glib-mkenums" in line]
              print("No find_program(GLIB2_MKENUMS ...) declaration found.")
              print("Matching lines:\n" + "\n".join(matching))
              raise SystemExit("Could not patch Poppler's GLib code generator.")

          call = match.group(0)
          if "glib-mkenums-script.py" not in call:
              body, count = re.subn(r"(?i)\bglib-mkenums\b",
                                    "glib-mkenums-script.py",
                                    match.group(2), count=1)
              if count != 1:
                  raise SystemExit(f"Could not replace generator in: {call}")
              text = text[:match.start()] + match.group(1) + body + match.group(3) + text[match.end():]
              cmake_file.write_text(text, encoding="utf-8")
              print("Patched GLIB2_MKENUMS to use glib-mkenums-script.py.")
          else:
              print("GLIB2_MKENUMS already uses glib-mkenums-script.py.")

          final_text = cmake_file.read_text(encoding="utf-8")
          match = pattern.search(final_text)
          if not match or "glib-mkenums-script.py" not in match.group(0):
              raise SystemExit("Verification failed: GLIB2_MKENUMS was not updated.")
          print("Verified declaration:", match.group(0).replace("\n", " "))
          PYCODE
            grep -n -A2 -B1 'GLIB2_MKENUMS' poppler/glib/CMakeLists.txt
          } 2>&1 | tee logs/04-poppler-glib-generator-patch.log

      - name: Build Cairo from source for 32-bit Windows
        if: matrix.need_cairo_source
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source .win-tools/env.sh
          {
            echo "Building Cairo for $MSYSTEM at $MINGW_PREFIX"
            wget --https-only -q https://cairographics.org/releases/cairo-1.18.6.tar.xz -O cairo-1.18.6.tar.xz
            echo '1c767308174337a74694da0f3ec069c271452163a1ef4540964c50c301f157d4  cairo-1.18.6.tar.xz' | sha256sum -c -
            tar -xf cairo-1.18.6.tar.xz
            meson setup cairo-1.18.6/build cairo-1.18.6 \
              --prefix="$(cygpath -m "$MINGW_PREFIX")" \
              --buildtype=release \
              --default-library=shared \
              -Dtests=disabled \
              -Dfontconfig=disabled \
              -Dfreetype=enabled \
              -Dglib=enabled \
              -Dzlib=enabled
            ninja -C cairo-1.18.6/build
            ninja -C cairo-1.18.6/build install
            pkgconf --modversion cairo
            pkgconf --cflags --libs cairo
          } 2>&1 | tee logs/05-build-cairo.log

      - name: Build Poppler
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source .win-tools/env.sh
          bash ./buildScripts/buildPoppler 2>&1 | tee logs/06-build-poppler.log

      - name: Download FontForge sources
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source .win-tools/env.sh
          bash ./buildScripts/getFontforge 2>&1 | tee logs/07-get-fontforge.log

      - name: Disable obsolete FontForge translation catalogs for this CLI build
        shell: msys2 {0}
        run: |
          set -euo pipefail
          {
            python - <<'PYCODE'
          from pathlib import Path
          import re

          cmake_file = Path("fontforge/CMakeLists.txt")
          if not cmake_file.is_file():
              raise SystemExit(f"FontForge CMakeLists not found: {cmake_file}")
          text = cmake_file.read_text(encoding="utf-8")
          marker = "# PDF2HTMLEX_WINDOWS_BUILD: translation catalogs skipped"
          if marker in text:
              print("FontForge translation step is already disabled.")
          else:
              pattern = re.compile(r"(?im)^[ \t]*add_subdirectory[ \t]*\([ \t]*po[ \t]*\)[ \t]*(?:#.*)?$")
              updated, count = pattern.subn(marker, text)
              if count != 1:
                  candidates = [line for line in text.splitlines()
                                if "add_subdirectory" in line.lower() and "po" in line.lower()]
                  print("Candidate CMake lines:\n" + "\n".join(candidates))
                  raise SystemExit(f"Expected one add_subdirectory(po) line, found {count}")
              cmake_file.write_text(updated, encoding="utf-8")
              print("Disabled PO catalog compilation; the pdf2htmlEX CLI build does not need translated FontForge UI catalogs.")
          verify = cmake_file.read_text(encoding="utf-8")
          if marker not in verify:
              raise SystemExit("FontForge translation-disable patch did not persist")
          PYCODE
            grep -n 'PDF2HTMLEX_WINDOWS_BUILD: translation catalogs skipped' fontforge/CMakeLists.txt
          } 2>&1 | tee logs/08-fontforge-translation-patch.log

      - name: Build FontForge
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source .win-tools/env.sh
          bash ./buildScripts/buildFontforge 2>&1 | tee logs/09-build-fontforge.log

      - name: Patch Windows gettext and iconv link dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          {
            test -f "$MINGW_PREFIX/lib/libintl.dll.a" || test -f "$MINGW_PREFIX/lib/libintl.a"
            test -f "$MINGW_PREFIX/lib/libiconv.dll.a" || test -f "$MINGW_PREFIX/lib/libiconv.a"
            python - <<'PYCODE'
          from pathlib import Path
          import re

          cmake_file = Path("pdf2htmlEX/CMakeLists.txt")
          if not cmake_file.is_file():
              raise SystemExit(f"Missing CMake file: {cmake_file}")
          text = cmake_file.read_text(encoding="utf-8")
          pattern = re.compile(
              r"(?is)if\s*\(\s*EXISTS\s+/usr/lib/libintl\.so\s*\)\s*"
              r"set\s*\(\s*LIB_INTL_LIBRARIES\s+-lintl\s*\)\s*"
              r"else\s*\(\s*\)\s*"
              r"set\s*\(\s*LIB_INTL_LIBRARIES\s+\"\"\s*\)\s*"
              r"endif\s*\(\s*\)")
          replacement = '''if (MINGW)
            set(LIB_INTL_LIBRARIES -lintl -liconv)
          elseif (EXISTS /usr/lib/libintl.so )
            set(LIB_INTL_LIBRARIES -lintl )
          else()
            set(LIB_INTL_LIBRARIES "" )
          endif()'''
          updated, count = pattern.subn(lambda _: replacement, text, count=1)
          if count != 1:
              print("Could not find the expected LIB_INTL_LIBRARIES block.")
              for i, line in enumerate(text.splitlines(), 1):
                  if "LIB_INTL_LIBRARIES" in line or "libintl.so" in line:
                      print(f"{i}: {line}")
              raise SystemExit("Refusing to build without explicitly linking gettext and iconv on MinGW.")
          cmake_file.write_text(updated, encoding="utf-8")
          check = cmake_file.read_text(encoding="utf-8")
          if "if (MINGW)\n  set(LIB_INTL_LIBRARIES -lintl -liconv)" not in check:
              raise SystemExit("Verification failed: MinGW gettext/iconv link patch was not persisted.")
          print("Patched pdf2htmlEX to link libintl and libiconv on MinGW.")
          PYCODE
            grep -n -A8 -B2 'LIB_INTL_LIBRARIES' pdf2htmlEX/CMakeLists.txt
          } 2>&1 | tee logs/10-gettext-iconv-link-patch.log

      - name: Patch Windows Unicode command-line and output paths
        shell: msys2 {0}
        run: |
          set -euo pipefail
          {
            python - <<'PYCODE'
          from pathlib import Path
          import re

          main = Path("pdf2htmlEX/src/pdf2htmlEX.cc")
          text = main.read_text(encoding="utf-8")
          old_include = '#ifdef __MINGW32__\n#include "util/mingw.h"\n#endif'
          new_include = '#ifdef __MINGW32__\n#ifndef NOMINMAX\n#define NOMINMAX\n#endif\n#include "util/mingw.h"\n#include <windows.h>\n#include <vector>\n#include <utility>\n#include <cwchar>\n#endif'
          if new_include not in text:
              if old_include not in text:
                  raise SystemExit("Could not find MinGW include block in pdf2htmlEX.cc")
              text = text.replace(old_include, new_include, 1)
          signature = "int main(int argc, char **argv)"
          if signature in text:
              text = text.replace(signature, "int pdf2htmlEX_main(int argc, char **argv)", 1)
          elif "int pdf2htmlEX_main(int argc, char **argv)" not in text:
              raise SystemExit("Could not find main() in pdf2htmlEX.cc")
          wrapper = r'''

          #ifdef __MINGW32__
          static std::string pdf2htmlEX_wide_to_utf8(const wchar_t *value)
          {
              if (value == nullptr) return std::string();
              int needed = WideCharToMultiByte(CP_UTF8, WC_ERR_INVALID_CHARS, value, -1, nullptr, 0, nullptr, nullptr);
              if (needed <= 0) return std::string();
              std::string result(static_cast<size_t>(needed), '\0');
              if (WideCharToMultiByte(CP_UTF8, WC_ERR_INVALID_CHARS, value, -1, &result[0], needed, nullptr, nullptr) <= 0)
                  return std::string();
              result.resize(static_cast<size_t>(needed - 1));
              return result;
          }

          int wmain(int argc, wchar_t **wargv)
          {
              std::vector<std::string> utf8_storage;
              std::vector<char *> utf8_argv;
              utf8_storage.reserve(static_cast<size_t>(argc));
              utf8_argv.reserve(static_cast<size_t>(argc) + 1);
              for (int i = 0; i < argc; ++i)
              {
                  std::string arg = pdf2htmlEX_wide_to_utf8(wargv[i]);
                  if (wargv[i] != nullptr && arg.empty() && wargv[i][0] != L'\0')
                  {
                      std::fwprintf(stderr, L"Cannot convert command-line argument to UTF-8.\n");
                      return EXIT_FAILURE;
                  }
                  utf8_storage.emplace_back(std::move(arg));
              }
              for (auto &arg : utf8_storage)
                  utf8_argv.push_back(const_cast<char *>(arg.c_str()));
              utf8_argv.push_back(nullptr);
              return pdf2htmlEX_main(argc, utf8_argv.data());
          }
          #else
          int main(int argc, char **argv)
          {
              return pdf2htmlEX_main(argc, argv);
          }
          #endif
          '''
          if "int wmain(int argc, wchar_t **wargv)" not in text:
              text = text.rstrip() + wrapper + "\n"
          main.write_text(text, encoding="utf-8")

          general = Path("pdf2htmlEX/src/HTMLRenderer/general.cc")
          gt = general.read_text(encoding="utf-8")
          if "#include <filesystem>" not in gt:
              gt = gt.replace("#include <cstdio>", "#include <cstdio>\n#include <filesystem>", 1)
          replacements = [
              ("new ofstream((char*)page_fn, ofstream::binary)", "new ofstream(std::filesystem::u8path((char*)page_fn), ofstream::binary)"),
              ("f_css.fs.open(f_css.path, ofstream::binary)", "f_css.fs.open(std::filesystem::u8path(f_css.path), ofstream::binary)"),
              ("f_outline.fs.open(f_outline.path, ofstream::binary)", "f_outline.fs.open(std::filesystem::u8path(f_outline.path), ofstream::binary)"),
              ("f_pages.fs.open(f_pages.path, ofstream::binary)", "f_pages.fs.open(std::filesystem::u8path(f_pages.path), ofstream::binary)"),
              ("output.open((char*)fn, ofstream::binary)", "output.open(std::filesystem::u8path((char*)fn), ofstream::binary)"),
              ("ifstream manifest_fin((char*)str_fmt(\"%s/%s\", param.data_dir.c_str(), MANIFEST_FILENAME.c_str()), ifstream::binary);", "ifstream manifest_fin(std::filesystem::u8path((char*)str_fmt(\"%s/%s\", param.data_dir.c_str(), MANIFEST_FILENAME.c_str())), ifstream::binary);"),
              ("ifstream fin(f_outline.path, ifstream::binary)", "ifstream fin(std::filesystem::u8path(f_outline.path), ifstream::binary)"),
              ("ifstream fin(f_pages.path, ifstream::binary)", "ifstream fin(std::filesystem::u8path(f_pages.path), ifstream::binary)"),
              ("ifstream fin(path, ifstream::binary)", "ifstream fin(std::filesystem::u8path(path), ifstream::binary)"),
              ("ofstream out(out_path, ofstream::binary)", "ofstream out(std::filesystem::u8path(out_path), ofstream::binary)"),
          ]
          for old, new in replacements:
              if old in gt:
                  gt = gt.replace(old, new)
              elif new not in gt:
                  raise SystemExit("Expected Unicode path substitution was not found: " + old)
          general.write_text(gt, encoding="utf-8")

          cmake = Path("pdf2htmlEX/CMakeLists.txt")
          ct = cmake.read_text(encoding="utf-8")
          marker = "target_link_libraries(pdf2htmlEX ${PDF2HTMLEX_LIBS})"
          unicode_link = marker + "\nif (MINGW)\n  target_link_options(pdf2htmlEX PRIVATE -municode)\nendif()"
          if "target_link_options(pdf2htmlEX PRIVATE -municode)" not in ct:
              if marker not in ct:
                  raise SystemExit("Could not locate target_link_libraries in CMakeLists.txt")
              ct = ct.replace(marker, unicode_link, 1)
          cmake.write_text(ct, encoding="utf-8")
          print("Patched wmain UTF-16 -> UTF-8 argv, filesystem UTF-8 paths, and MinGW -municode linker option.")
          PYCODE
          } 2>&1 | tee logs/11-windows-unicode-patch.log

      - name: Build pdf2htmlEX.exe (CMake 4 and MinGW gettext compatibility)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source .win-tools/env.sh
          {
            echo "CMake version:"
            cmake --version
            echo "Compiler flags: CFLAGS=$CFLAGS"
            echo "Compiler flags: CXXFLAGS=$CXXFLAGS"
            echo "Using CMAKE_POLICY_VERSION_MINIMUM=3.5 for the legacy pdf2htmlEX CMakeLists.txt"
            CMAKE_POLICY_VERSION_MINIMUM=3.5 bash ./buildScripts/buildPdf2htmlEX
          } 2>&1 | tee logs/10-build-pdf2htmlEX.log

      - name: Assemble portable directory and resolve runtime DLL dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          source .win-tools/env.sh
          mkdir -p package/data/poppler
          cp pdf2htmlEX/build/pdf2htmlEX.exe package/
          cp -a pdf2htmlEX/share/. package/data/
          cp -a poppler-data/. package/data/poppler/

          python - <<'PYCODE'
          import os, re, shutil, subprocess
          from collections import deque
          from pathlib import Path

          package = Path("package")
          exe = package / "pdf2htmlEX.exe"
          bindir = Path(os.environ["MINGW_PREFIX"]) / "bin"
          objdump = bindir / "objdump.exe"
          if not exe.is_file() or not objdump.is_file():
              raise SystemExit("Expected executable or architecture objdump tool is missing")

          queue = deque([exe])
          seen_images = set()
          copied = set()
          while queue:
              image = queue.popleft()
              try:
                  key = str(image.resolve()).lower()
              except OSError:
                  key = str(image).lower()
              if key in seen_images:
                  continue
              seen_images.add(key)
              result = subprocess.run([str(objdump), "-p", str(image)], capture_output=True, text=True, errors="replace")
              if result.returncode != 0:
                  print(f"Warning: objdump failed for {image}: {result.stderr}")
                  continue
              imports = re.findall(r"^\s*DLL Name:\s*([^\s]+)", result.stdout, flags=re.M | re.I)
              for dll in imports:
                  src = bindir / dll
                  if not src.is_file():
                      continue  # Windows system/API-set DLL, or a non-MinGW dependency.
                  key = dll.lower()
                  dst = package / dll
                  if key not in copied:
                      if not dst.exists():
                          shutil.copy2(src, dst)
                          print(f"Bundled runtime DLL: {dll}")
                      copied.add(key)
                      queue.append(src)

          print(f"Runtime DLLs bundled: {len(copied)}")
          if not (package / "data" / "manifest").is_file():
              raise SystemExit("Packaging error: package/data/manifest is missing")
          if not (package / "data" / "poppler").is_dir():
              raise SystemExit("Packaging error: package/data/poppler is missing")
          PYCODE
          ls -la package | tee logs/12-package-list.log
          find package/data -maxdepth 2 -type f | head -60 | tee logs/12-data-list.log

      - name: Verify raw executable architecture and version
        shell: msys2 {0}
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import os, struct
          from pathlib import Path
          path = Path("package/pdf2htmlEX.exe")
          data = path.read_bytes()
          if data[:2] != b"MZ":
              raise SystemExit("Output is not a valid Windows PE executable")
          pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
          if data[pe_offset:pe_offset + 4] != b"PE\0\0":
              raise SystemExit("Missing PE signature")
          machine = struct.unpack_from("<H", data, pe_offset + 4)[0]
          expected = {"x86": 0x014C, "x64": 0x8664}[os.environ["BUILD_ARCH"]]
          print(f"PE machine=0x{machine:04x}; expected=0x{expected:04x}; architecture={os.environ['BUILD_ARCH']}")
          if machine != expected:
              raise SystemExit("The generated executable architecture does not match the matrix job")
          PYCODE
          ./package/pdf2htmlEX.exe --version 2>&1 | tee logs/13-raw-version-test.log

      - name: Build one-file self-extracting Windows launcher
        shell: msys2 {0}
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p onefile .win-tools
          cat > .win-tools/pdf2htmlex_onefile_stub.cpp <<'CPP'
          #define WIN32_LEAN_AND_MEAN
          #include <windows.h>
          #include <cstdint>
          #include <cstring>
          #include <cstdio>
          #include <cwchar>
          #include <string>
          #include <vector>

          struct Footer { char magic[8]; std::uint64_t offset; std::uint64_t size; };
          static const char kMagic[8] = {'P','2','H','T','A','R','1','\0'};

          static bool read_exact(HANDLE h, void *buffer, DWORD bytes) {
              char *p = static_cast<char *>(buffer);
              DWORD total = 0;
              while (total < bytes) {
                  DWORD got = 0;
                  if (!ReadFile(h, p + total, bytes - total, &got, nullptr) || got == 0) return false;
                  total += got;
              }
              return true;
          }
          static std::wstring utf8_to_wide(const std::string &s) {
              if (s.empty()) return std::wstring();
              int n = MultiByteToWideChar(CP_UTF8, MB_ERR_INVALID_CHARS, s.data(), (int)s.size(), nullptr, 0);
              if (n <= 0) return std::wstring();
              std::wstring w((size_t)n, L'\0');
              if (MultiByteToWideChar(CP_UTF8, MB_ERR_INVALID_CHARS, s.data(), (int)s.size(), &w[0], n) != n) return std::wstring();
              return w;
          }
          static std::wstring quote_arg(const std::wstring &arg) {
              if (!arg.empty() && arg.find_first_of(L" \t\n\v\"") == std::wstring::npos) return arg;
              std::wstring out = L"\"";
              size_t slashes = 0;
              for (wchar_t ch : arg) {
                  if (ch == L'\\') { ++slashes; continue; }
                  if (ch == L'\"') { out.append(slashes * 2 + 1, L'\\'); out += L'\"'; slashes = 0; continue; }
                  out.append(slashes, L'\\'); slashes = 0; out += ch;
              }
              out.append(slashes * 2, L'\\');
              out += L'\"';
              return out;
          }
          static bool create_dirs(const std::wstring &path) {
              std::wstring current;
              size_t start = 0;
              if (path.size() >= 3 && path[1] == L':' && (path[2] == L'\\' || path[2] == L'/')) {
                  current = path.substr(0, 3); start = 3;
              } else if (path.size() >= 2 && path[0] == L'\\' && path[1] == L'\\') {
                  size_t a = path.find(L'\\', 2); if (a == std::wstring::npos) return false;
                  size_t b = path.find(L'\\', a + 1); if (b == std::wstring::npos) { CreateDirectoryW(path.c_str(), nullptr); return true; }
                  current = path.substr(0, b + 1); start = b + 1;
              }
              for (size_t i = start; i < path.size(); ++i) {
                  current += path[i];
                  if (path[i] == L'\\' || path[i] == L'/') {
                      if (!current.empty()) CreateDirectoryW(current.c_str(), nullptr);
                  }
              }
              if (!CreateDirectoryW(path.c_str(), nullptr) && GetLastError() != ERROR_ALREADY_EXISTS) return false;
              return true;
          }
          static bool safe_relative_path(std::string &p) {
              for (char &c : p) if (c == '\\') c = '/';
              while (p.rfind("./", 0) == 0) p.erase(0, 2);
              if (p.empty() || p == ".") return true;
              if (p[0] == '/' || p.find(':') != std::string::npos) return false;
              size_t pos = 0;
              while (pos <= p.size()) {
                  size_t end = p.find('/', pos);
                  std::string part = p.substr(pos, end == std::string::npos ? std::string::npos : end - pos);
                  if (part == "..") return false;
                  if (end == std::string::npos) break;
                  pos = end + 1;
              }
              return true;
          }
          static std::uint64_t parse_octal(const unsigned char *p, size_t n) {
              std::uint64_t value = 0; bool seen = false;
              for (size_t i = 0; i < n; ++i) {
                  if (p[i] == 0 || p[i] == ' ') { if (seen) break; else continue; }
                  if (p[i] < '0' || p[i] > '7') return 0;
                  seen = true; value = value * 8 + (p[i] - '0');
              }
              return value;
          }
          static std::string field_string(const unsigned char *p, size_t n) {
              size_t len = 0; while (len < n && p[len] != 0) ++len;
              return std::string(reinterpret_cast<const char *>(p), len);
          }
          static bool extract_tar(const std::vector<unsigned char> &tar, const std::wstring &root) {
              size_t off = 0;
              while (off + 512 <= tar.size()) {
                  const unsigned char *h = tar.data() + off;
                  bool zero = true; for (size_t i = 0; i < 512; ++i) if (h[i] != 0) { zero = false; break; }
                  if (zero) break;
                  std::string name = field_string(h, 100);
                  std::string prefix = field_string(h + 345, 155);
                  if (!prefix.empty()) name = prefix + "/" + name;
                  std::uint64_t size = parse_octal(h + 124, 12);
                  char type = (char)h[156];
                  size_t dataoff = off + 512;
                  if (size > tar.size() || dataoff > tar.size() || size > tar.size() - dataoff) return false;
                  if (!safe_relative_path(name)) return false;
                  if (!name.empty() && name != ".") {
                      std::wstring rel = utf8_to_wide(name);
                      if (rel.empty()) return false;
                      for (wchar_t &c : rel) if (c == L'/') c = L'\\';
                      std::wstring full = root + L"\\" + rel;
                      if (type == '5') {
                          if (!create_dirs(full)) return false;
                      } else if (type == 0 || type == '0') {
                          size_t last = full.find_last_of(L"\\/");
                          if (last != std::wstring::npos && !create_dirs(full.substr(0, last))) return false;
                          HANDLE out = CreateFileW(full.c_str(), GENERIC_WRITE, 0, nullptr, CREATE_ALWAYS, FILE_ATTRIBUTE_NORMAL, nullptr);
                          if (out == INVALID_HANDLE_VALUE) return false;
                          size_t written = 0; bool ok = true;
                          while (written < size) {
                              DWORD chunk = (DWORD)((size - written) > 1024 * 1024 ? 1024 * 1024 : (size - written));
                              DWORD done = 0;
                              if (!WriteFile(out, tar.data() + dataoff + written, chunk, &done, nullptr) || done != chunk) { ok = false; break; }
                              written += done;
                          }
                          CloseHandle(out);
                          if (!ok) return false;
                      } else {
                          return false; // only regular files and directories are expected in the payload
                      }
                  }
                  std::uint64_t padded = ((size + 511) / 512) * 512;
                  if (padded > tar.size() - dataoff) return false;
                  off = dataoff + (size_t)padded;
              }
              return true;
          }
          static void remove_tree(const std::wstring &dir) {
              std::wstring pattern = dir + L"\\*";
              WIN32_FIND_DATAW fd;
              HANDLE find = FindFirstFileW(pattern.c_str(), &fd);
              if (find != INVALID_HANDLE_VALUE) {
                  do {
                      if (wcscmp(fd.cFileName, L".") == 0 || wcscmp(fd.cFileName, L"..") == 0) continue;
                      std::wstring child = dir + L"\\" + fd.cFileName;
                      if (fd.dwFileAttributes & FILE_ATTRIBUTE_DIRECTORY) remove_tree(child);
                      else { SetFileAttributesW(child.c_str(), FILE_ATTRIBUTE_NORMAL); DeleteFileW(child.c_str()); }
                  } while (FindNextFileW(find, &fd));
                  FindClose(find);
              }
              SetFileAttributesW(dir.c_str(), FILE_ATTRIBUTE_NORMAL);
              RemoveDirectoryW(dir.c_str());
          }
          int wmain(int argc, wchar_t **argv) {
              wchar_t self[32768];
              DWORD selfLen = GetModuleFileNameW(nullptr, self, (DWORD)(sizeof(self) / sizeof(self[0])));
              if (selfLen == 0 || selfLen >= sizeof(self) / sizeof(self[0])) { fwprintf(stderr, L"Cannot locate this executable.\n"); return 1; }
              HANDLE file = CreateFileW(self, GENERIC_READ, FILE_SHARE_READ, nullptr, OPEN_EXISTING, FILE_ATTRIBUTE_NORMAL, nullptr);
              if (file == INVALID_HANDLE_VALUE) { fwprintf(stderr, L"Cannot open the one-file executable.\n"); return 1; }
              LARGE_INTEGER fileSize;
              if (!GetFileSizeEx(file, &fileSize) || fileSize.QuadPart < (LONGLONG)sizeof(Footer)) { CloseHandle(file); fwprintf(stderr, L"Invalid one-file executable.\n"); return 1; }
              LARGE_INTEGER pos; pos.QuadPart = fileSize.QuadPart - sizeof(Footer);
              if (!SetFilePointerEx(file, pos, nullptr, FILE_BEGIN)) { CloseHandle(file); return 1; }
              Footer foot{};
              if (!read_exact(file, &foot, sizeof(foot)) || memcmp(foot.magic, kMagic, sizeof(kMagic)) != 0 || foot.offset + foot.size + sizeof(Footer) != (std::uint64_t)fileSize.QuadPart || foot.size > (std::uint64_t)SIZE_MAX) {
                  CloseHandle(file); fwprintf(stderr, L"Embedded runtime payload is missing or corrupt.\n"); return 1;
              }
              std::vector<unsigned char> tar((size_t)foot.size);
              pos.QuadPart = (LONGLONG)foot.offset;
              if (!SetFilePointerEx(file, pos, nullptr, FILE_BEGIN) || !read_exact(file, tar.data(), (DWORD)tar.size())) {
                  CloseHandle(file); fwprintf(stderr, L"Cannot read embedded runtime payload.\n"); return 1;
              }
              CloseHandle(file);
              wchar_t tempBase[32768]; DWORD tempLen = GetTempPathW((DWORD)(sizeof(tempBase) / sizeof(tempBase[0])), tempBase);
              if (tempLen == 0 || tempLen >= sizeof(tempBase) / sizeof(tempBase[0])) { fwprintf(stderr, L"Cannot locate the temporary directory.\n"); return 1; }
              wchar_t tempName[MAX_PATH];
              if (!GetTempFileNameW(tempBase, L"p2h", 0, tempName)) { fwprintf(stderr, L"Cannot create temporary directory name.\n"); return 1; }
              DeleteFileW(tempName);
              if (!CreateDirectoryW(tempName, nullptr)) { fwprintf(stderr, L"Cannot create temporary extraction directory.\n"); return 1; }
              std::wstring root = tempName;
              if (!extract_tar(tar, root)) { remove_tree(root); fwprintf(stderr, L"Cannot extract embedded runtime payload.\n"); return 1; }
              std::wstring child = root + L"\\pdf2htmlEX.exe";
              std::wstring command = quote_arg(child);
              for (int i = 1; i < argc; ++i) { command += L" "; command += quote_arg(argv[i]); }
              std::vector<wchar_t> writable(command.begin(), command.end()); writable.push_back(L'\0');
              STARTUPINFOW si{}; si.cb = sizeof(si);
              HANDLE in = GetStdHandle(STD_INPUT_HANDLE), out = GetStdHandle(STD_OUTPUT_HANDLE), err = GetStdHandle(STD_ERROR_HANDLE);
              if (in && in != INVALID_HANDLE_VALUE && out && out != INVALID_HANDLE_VALUE && err && err != INVALID_HANDLE_VALUE) {
                  si.dwFlags = STARTF_USESTDHANDLES; si.hStdInput = in; si.hStdOutput = out; si.hStdError = err;
              }
              PROCESS_INFORMATION pi{};
              BOOL started = CreateProcessW(child.c_str(), writable.data(), nullptr, nullptr, TRUE, 0, nullptr, nullptr, &si, &pi);
              if (!started) { DWORD e = GetLastError(); remove_tree(root); fwprintf(stderr, L"Cannot start pdf2htmlEX (Windows error %lu).\n", (unsigned long)e); return 1; }
              CloseHandle(pi.hThread); WaitForSingleObject(pi.hProcess, INFINITE);
              DWORD exitCode = 1; GetExitCodeProcess(pi.hProcess, &exitCode); CloseHandle(pi.hProcess);
              remove_tree(root);
              return (int)exitCode;
          }
          CPP
          g++ -std=c++17 -Os -s -static -static-libgcc -static-libstdc++ -municode .win-tools/pdf2htmlex_onefile_stub.cpp -o .win-tools/pdf2htmlEX-onefile-stub.exe
          tar --format=ustar -cf .win-tools/pdf2htmlex-runtime.tar -C package .
          python - <<'PYCODE'
          from pathlib import Path
          import struct
          stub = Path(".win-tools/pdf2htmlEX-onefile-stub.exe").read_bytes()
          payload = Path(".win-tools/pdf2htmlex-runtime.tar").read_bytes()
          out = Path("onefile") / f"pdf2htmlEX-${{ matrix.arch }}-onefile.exe"
          with out.open("wb") as f:
              f.write(stub)
              f.write(payload)
              f.write(struct.pack("<8sQQ", b"P2HTAR1\0", len(stub), len(payload)))
          print(f"Wrote self-extracting file: {out} ({out.stat().st_size:,} bytes)")
          PYCODE

      - name: Set up Python for Unicode conversion test
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Test raw and one-file builds with Chinese input and output paths
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP 'pdf2htmlEX-UTF8-test'
          $testDir = Join-Path $testRoot '灵媒指南Psychic Guidebooks'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          $maker = Join-Path $testRoot 'make_fixture.py'
          @'
          from pathlib import Path
          import sys
          out = Path(sys.argv[1])
          stream = b'BT /F1 18 Tf 72 720 Td (Unicode path test) Tj ET\n'
          objs = [
              b'<< /Type /Catalog /Pages 2 0 R >>',
              b'<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
              b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>',
              f'<< /Length {len(stream)} >>\nstream\n'.encode('ascii') + stream + b'endstream',
              b'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
          ]
          data = bytearray(b'%PDF-1.4\n')
          offsets = [0]
          for i, obj in enumerate(objs, 1):
              offsets.append(len(data))
              data.extend(f'{i} 0 obj\n'.encode('ascii'))
              data.extend(obj + b'\nendobj\n')
          xref = len(data)
          data.extend(f'xref\n0 {len(objs)+1}\n0000000000 65535 f \n'.encode('ascii'))
          for off in offsets[1:]:
              data.extend(f'{off:010d} 00000 n \n'.encode('ascii'))
          data.extend(f'trailer\n<< /Size {len(objs)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode('ascii'))
          out.write_bytes(data)
          '@ | Set-Content -LiteralPath $maker -Encoding utf8
          $pdf = Join-Path $testDir '直觉之路-input.pdf'
          & python $maker $pdf
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $pdf)) { throw 'Failed to create Unicode PDF fixture' }
          $rawExe = Join-Path $env:GITHUB_WORKSPACE 'package\pdf2htmlEX.exe'
          $oneExe = Join-Path $env:GITHUB_WORKSPACE ("onefile\pdf2htmlEX-{0}-onefile.exe" -f $env:BUILD_ARCH)
          $rawHtml = '原生版本-转换结果.html'
          Push-Location $testDir
          try {
            Write-Host 'Testing portable executable with Unicode input/output paths...'
            & $rawExe $pdf $rawHtml
            if ($LASTEXITCODE -ne 0) { throw "Portable executable failed with exit code $LASTEXITCODE" }
            if (!(Test-Path -LiteralPath (Join-Path $testDir $rawHtml)) -or (Get-Item -LiteralPath (Join-Path $testDir $rawHtml)).Length -lt 100) { throw 'Portable executable produced no usable HTML output' }
            $oneHtml = '单文件版本-转换结果.html'
            Write-Host 'Testing single-file executable with Unicode input/output paths...'
            & $oneExe $pdf $oneHtml
            if ($LASTEXITCODE -ne 0) { throw "Single-file executable failed with exit code $LASTEXITCODE" }
            if (!(Test-Path -LiteralPath (Join-Path $testDir $oneHtml)) -or (Get-Item -LiteralPath (Join-Path $testDir $oneHtml)).Length -lt 100) { throw 'Single-file executable produced no usable HTML output' }
          } finally { Pop-Location }

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pdf2htmlEX-windows-${{ matrix.arch }}-build-logs
          path: logs/
          if-no-files-found: warn

      - name: Upload portable Windows build (exe + DLLs + data)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pdf2htmlEX-windows-${{ matrix.arch }}-portable
          path: package/
          if-no-files-found: error

      - name: Upload single-file Windows executable
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: pdf2htmlEX-windows-${{ matrix.arch }}-onefile
          path: onefile/pdf2htmlEX-${{ matrix.arch }}-onefile.exe
          if-no-files-found: error


  combine-builds:
    name: Combine x86 and x64 downloads
    needs: build-windows
    if: needs.build-windows.result == 'success'
    runs-on: windows-2022
    steps:
      - name: Download portable directory artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pdf2htmlEX-windows-*-portable
          path: combined/portable
          merge-multiple: false

      - name: Download one-file executables
        uses: actions/download-artifact@v8
        with:
          pattern: pdf2htmlEX-windows-*-onefile
          path: combined/onefile
          merge-multiple: false

      - name: Verify x86 and x64 builds are present
        shell: pwsh
        run: |
          $portableX64 = Test-Path 'combined/portable/pdf2htmlEX-windows-x64-portable/pdf2htmlEX.exe'
          $portableX86 = Test-Path 'combined/portable/pdf2htmlEX-windows-x86-portable/pdf2htmlEX.exe'
          $oneX64 = Test-Path 'combined/onefile/pdf2htmlEX-windows-x64-onefile/pdf2htmlEX-x64-onefile.exe'
          $oneX86 = Test-Path 'combined/onefile/pdf2htmlEX-windows-x86-onefile/pdf2htmlEX-x86-onefile.exe'
          if (!($portableX64 -and $portableX86 -and $oneX64 -and $oneX86)) {
            Write-Error "Missing outputs: portable x64=$portableX64, portable x86=$portableX86, onefile x64=$oneX64, onefile x86=$oneX86"
          }

      - name: Upload combined portable builds
        uses: actions/upload-artifact@v7
        with:
          name: pdf2htmlEX-windows-x86-x64-portable
          path: combined/portable/
          if-no-files-found: error

      - name: Upload combined single-file executables
        uses: actions/upload-artifact@v7
        with:
          name: pdf2htmlEX-windows-x86-x64-onefile
          path: combined/onefile/
          if-no-files-found: error
